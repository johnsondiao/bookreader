name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      uploadArtifact:
        description: '是否上传 APK artifact（日常 push 默认不上，节省 GitHub Actions 存储额度）'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_TTS_KEY_CIPHER: ${{ secrets.VITE_TTS_KEY_CIPHER }}
          VITE_TTS_KEY_IV: ${{ secrets.VITE_TTS_KEY_IV }}
          VITE_TTS_KEY_SALT: ${{ secrets.VITE_TTS_KEY_SALT }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/朗阅-release.apk
          ls -lh out/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: bookreader-release-apk
          path: out/朗阅-release.apk
          # 免费版 GitHub Actions 存储额度只有 ~500MB，retention 3 天避免堆积；
          # 正式版本以 Release 页面的附件为准（打 tag 时会自动发 Release）。
          retention-days: 3

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/朗阅-release.apk
