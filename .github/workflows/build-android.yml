name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      uploadArtifact:
        description: '是否上传 APK artifact（日常 push 默认不上，节省 GitHub Actions 存储额度）'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_TTS_KEY_CIPHER: ${{ secrets.VITE_TTS_KEY_CIPHER }}
          VITE_TTS_KEY_IV: ${{ secrets.VITE_TTS_KEY_IV }}
          VITE_TTS_KEY_SALT: ${{ secrets.VITE_TTS_KEY_SALT }}

      # 本地 TTS 依赖：sherpa-onnx AAR + 随包模型（melo）。
      # 两者都不进 git（共约 107MB），构建前按 manifest.json 拉取，脚本幂等。
      - name: Fetch local TTS deps (AAR + bundled model)
        run: node scripts/fetch-local-tts.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/langyue-release.apk
          # 带版本号的副本：用户能直接看出装的是哪一版
          V=$(node -p "require('./package.json').version")
          cp out/langyue-release.apk "out/langyue-${V}-run${GITHUB_RUN_NUMBER}.apk"
          ls -lh out/

      # 模型全部随包后 APK 约 360MB；Actions 免费存储额度只有 ~500MB，
      # 上传 artifact 几次就会爆额度，故不再上传 artifact，
      # 下载走滚动 Release（公开免登录）与 apk-dist 分支。

      - name: Publish rolling Release (main/master push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-build
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "最新构建（自动更新）" \
              --notes "每次推送 main 自动更新附件；公开仓库可直接下载，无需登录。"
          fi
          gh release upload "$TAG" out/langyue-release.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" out/langyue-*-run*.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "commit: ${GITHUB_SHA}
          run: #${{ github.run_number }}
          时间: $(date -u '+%Y-%m-%d %H:%M UTC')
          说明: $(git log -1 --pretty=%s)"

      - name: Publish APK to apk-dist branch (git 通道下载，不依赖 github.com HTTPS 直连)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf apk-branch && mkdir apk-branch
          cp out/langyue-release.apk apk-branch/
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${{ github.run_number }}"
            echo "version=$(node -p "require('./package.json').version")"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "message=$(git log -1 --pretty=%s)"
          } > apk-branch/BUILD_INFO.txt
          cd apk-branch
          git init -q -b apk-dist
          git config user.name "langyue-ci"
          git config user.email "ci@langyue.local"
          git add -A
          git commit -q -m "apk build ${GITHUB_SHA}"
          # 孤分支强推：不累积历史，仓库体积恒定
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist:apk-dist

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/langyue-release.apk
