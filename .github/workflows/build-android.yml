name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      uploadArtifact:
        description: '是否上传 APK artifact（日常 push 默认不上，节省 GitHub Actions 存储额度）'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_TTS_KEY_CIPHER: ${{ secrets.VITE_TTS_KEY_CIPHER }}
          VITE_TTS_KEY_IV: ${{ secrets.VITE_TTS_KEY_IV }}
          VITE_TTS_KEY_SALT: ${{ secrets.VITE_TTS_KEY_SALT }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/langyue-release.apk
          ls -lh out/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: bookreader-release-apk
          path: out/langyue-release.apk
          # 免费版 GitHub Actions 存储额度只有 ~500MB，retention 3 天避免堆积；
          # 日常下载走滚动 Release（公开仓库免登录），正式版以 tag Release 为准。
          retention-days: 3

      - name: Publish rolling Release (main/master push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-build
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "最新构建（自动更新）" \
              --notes "每次推送 main 自动更新附件；公开仓库可直接下载，无需登录。"
          fi
          gh release upload "$TAG" out/langyue-release.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "commit: ${GITHUB_SHA}
          run: #${{ github.run_number }}
          时间: $(date -u '+%Y-%m-%d %H:%M UTC')
          说明: $(git log -1 --pretty=%s)"

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/langyue-release.apk
